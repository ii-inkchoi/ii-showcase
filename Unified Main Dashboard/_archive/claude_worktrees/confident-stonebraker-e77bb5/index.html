<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Prototypes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 393px;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 32px;
    }

    .title {
      font-size: 14px;
      color: #666;
      margin-bottom: 48px;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    a.card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-top: 1px solid #1a1a1a;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.15s;
    }

    a.card:last-child {
      border-bottom: 1px solid #1a1a1a;
    }

    a.card:active {
      opacity: 0.5;
    }

    .card-text {}

    .card-name {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 11px;
      color: #444;
      letter-spacing: 0.02em;
    }

    .arrow {
      font-size: 16px;
      color: #333;
    }

    .footer {
      margin-top: 48px;
      font-size: 10px;
      color: #2a2a2a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">Prototype Review</div>

    <div class="links">
      <a class="card" href="/dashboard-C">
        <div class="card-text">
          <div class="card-name">Dashboard — C</div>
          <div class="card-desc">One-line split · Main candidate</div>
        </div>
        <span class="arrow">›</span>
      </a>

      <a class="card" href="/tc-split-options">
        <div class="card-text">
          <div class="card-name">TC Split Options</div>
          <div class="card-desc">5 variants · A / B / C / D / E</div>
        </div>
        <span class="arrow">›</span>
      </a>
    </div>

    <div class="footer">// Internal use only</div>
  </div>
</body>
</html>
