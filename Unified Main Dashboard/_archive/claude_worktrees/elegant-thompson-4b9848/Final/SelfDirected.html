<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Self-Directed · Scenarios</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-black: #000000;
      --c-1000:  #1C1C1C;
      --c-900:   #232627;
      --c-800:   #565B5E;
      --c-700:   #929292;
      --c-600:   #A7A7A7;
      --c-400:   #C7C7C7;
      --c-200:   #E3E2E2;
      --c-white: #FFFFFF;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .frame { width: 100%; max-width: 393px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; text-align: right; padding-bottom: 180px; }

    .header { height: 71px; display: flex; align-items: center; justify-content: space-between; padding: 0 13.5px; border-bottom: 0.5px solid #1C1C1C; }
    .logo { height: 14.4px; width: auto; display: block; }
    .header-icons { display: flex; align-items: center; gap: 20px; }
    .header-icons img { width: 17px; height: 17px; opacity: 0.85; display: block; }
    .header-icons img[alt="menu"] { opacity: 0.4; }

    /* MESSAGE CENTER — follows Stock Page rule */
    .msg-center { text-align: left; }

    /* Account callout — elevated bg for highest-priority account messages */
    .account-callout {
      padding: 20px 13.5px;
      background: #1A1D20;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .account-callout .eyebrow {
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--c-400);
      font-weight: 400;
    }
    .account-callout p.body {
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--c-700);
      font-weight: 400;
      margin-top: 4px;
    }

    /* Callout — notice framed by top & bottom inner 105px dividers */
    .callout {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
      margin: 0 13.5px;
    }
    .callout::before,
    .callout::after {
      content: '';
      position: absolute;
      left: 0;
      height: 1px;
      width: 105px;
      background: #1C1C1C;
    }
    .callout::before { top: 0; }
    .callout::after  { bottom: 0; }
    .callout p {
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--c-400);
      font-weight: 400;
    }
    .callout a.action {
      display: inline-block;
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--c-700);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--c-800);
      align-self: flex-start;
      cursor: pointer;
    }
    .callout a.action:active { opacity: 0.5; transition: opacity 80ms ease; }
    .callout .eyebrow {
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--c-700);
      font-weight: 400;
    }
    .callout .eyebrow + p { margin-top: -12px; }
    .callout .inner-divider {
      height: 1px;
      width: 105px;
      background: #1C1C1C;
      margin: 4px 0;
    }

    .total-capital { padding: 0 13.5px; margin-top: 60px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .tc-label { font-size: 13px; color: var(--c-700); letter-spacing: -0.22px; line-height: 1.25; text-transform: capitalize; }
    .tc-value { font-size: 28px; color: #fff; font-feature-settings: 'lnum' 1, 'pnum' 1; line-height: normal; letter-spacing: -0.56px; }
    .tc-ccy { color: var(--c-800); }

    .divider { border: none; border-top: 1px solid #1C1C1C; margin: 0 13.5px; }
    .section { padding: 30px 13.5px 0; }
    .s-inner { display: flex; flex-direction: column; gap: 50px; }
    .s-title-wrap { display: flex; align-items: flex-start; justify-content: space-between; }
    .s-title-col { display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .t-primary   { font-size: 18px; color: var(--c-400); font-weight: 400; letter-spacing: -0.36px; line-height: 1.15; text-transform: capitalize; }
    .t-secondary { font-size: 15px; color: #565b5e; font-weight: 400; letter-spacing: -0.3px; line-height: 1.2; text-transform: capitalize; }

    .data-col { display: flex; flex-direction: column; align-items: flex-end; gap: 50px; width: 100%; }
    .db { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; }
    .db-label { font-size: 13px; color: var(--c-700); letter-spacing: -0.22px; line-height: 1.25; text-transform: capitalize; width: 100%; }
    .n22 { font-size: 22px; color: #fff; font-feature-settings: 'lnum' 1, 'pnum' 1; line-height: normal; width: 100%; letter-spacing: -0.44px; }
    .n15 { font-size: 15px; color: var(--c-400); font-feature-settings: 'lnum' 1, 'tnum' 1; line-height: normal; width: 100%; letter-spacing: -0.3px; }

    .gain-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; font-size: 13px; white-space: nowrap; }
    .gain-pair { display: flex; align-items: center; gap: 4px; }
    .ga { color: var(--c-400); font-feature-settings: 'lnum' 1, 'tnum' 1; }
    .gp { color: #c7c7c7; font-feature-settings: 'lnum' 1, 'tnum' 1; }
    .gt { color: #929292; text-transform: capitalize; }

    .tbl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; font-size: 13px; text-transform: capitalize; white-space: nowrap; }
    .tbl-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .tl { color: #929292; }
    .tl-mid { color: var(--c-700); }
    .tv { color: var(--c-400); font-feature-settings: 'lnum' 1, 'tnum' 1; }

    .cash-block { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; white-space: nowrap; }
    .cash-lbl { font-size: 13px; color: #929292; text-transform: capitalize; line-height: normal; }

    .acct-sw { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .acct-label { font-size: 15px; color: #c7c7c7; letter-spacing: -0.3px; line-height: 1.35; text-transform: capitalize; }
    .acct-chev { width: 7px; height: 4px; display: block; }

    .pos-group { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; width: 100%; }
    .pos-head { font-size: 15px; color: var(--c-400); letter-spacing: -0.3px; line-height: 1.15; text-transform: capitalize; width: 100%; white-space: pre-wrap; }
    .view-all { font-size: 13px; color: var(--c-400); text-transform: capitalize; line-height: normal; width: 100%; cursor: pointer; }
    .open-orders { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; font-size: 15px; letter-spacing: -0.3px; line-height: 1.15; text-transform: capitalize; white-space: nowrap; }
    .oo-lbl { color: #c7c7c7; }
    .oo-n { color: #c7c7c7; font-feature-settings: 'lnum' 1, 'tnum' 1; }

    .mt-managed { margin-top: 70px; }
    .mt-active  { margin-top: 70px; }

    [data-final] { font-variant-numeric: tabular-nums; }
    .header, .msg-center, .total-capital, .mt-managed, .mt-active { animation: fade-in 700ms ease-out both; }
    .header        { animation-delay:   0ms; }
    .msg-center    { animation-delay:  80ms; }
    .total-capital { animation-delay: 150ms; }
    .mt-managed    { animation-delay: 350ms; }
    .mt-active     { animation-delay: 550ms; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .header, .msg-center, .total-capital, .mt-managed, .mt-active { animation: none; } }

    /* CHIP BAR */
    .chip-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 18, 20, 0.92); border: 1px solid #232627; border-radius: 100px;
      padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 10px;
      max-width: min(1100px, 94vw); justify-content: center;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100;
    }
    .chip {
      padding: 6px 12px; font-size: 12px; color: #929292;
      background: transparent; border: none; border-radius: 20px; cursor: pointer;
      white-space: nowrap; letter-spacing: -0.01em; font-family: inherit;
      transition: color 120ms ease, background 120ms ease;
    }
    .chip:hover { color: #fff; }
    .chip.active { background: #fff; color: #000; font-weight: 500; }
    .chip-bar.collapsed .chip:not(.active) { display: none; }
    .chip.active { cursor: pointer; }
    .chip.active::after { content: "▾"; margin-left: 6px; font-size: 10px; opacity: 0.6; }
    .chip-bar:not(.collapsed) .chip.active::after { content: "▴"; }
  </style>
</head>
<body>

<div class="frame">
  <header class="header">
    <img class="logo" src="Logo.svg" alt="logo">
    <div class="header-icons">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg" alt="search"><circle cx="7.5" cy="7.5" r="5.5" stroke="#D9D9D9" stroke-width="1"/><path d="M11.5 11.5L15.5 15.5" stroke="#D9D9D9" stroke-width="1" stroke-linecap="round"/></svg>
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg" alt="menu"><path d="M2 4H15M2 9H15M2 14H15" stroke="#666666" stroke-width="1" stroke-linecap="round"/></svg>
    </div>
  </header>

  <div class="msg-center" id="msg-center" hidden></div>

  <div class="total-capital" id="total-capital"></div>

  <div class="mt-managed">
    <hr class="divider">
    <div class="section"><div class="s-inner" id="managed-inner"></div></div>
  </div>

  <div class="mt-active">
    <hr class="divider">
    <div class="section"><div class="s-inner" id="active-inner"></div></div>
  </div>
</div>

<nav class="chip-bar" id="chipBar"></nav>

<script>
  /* ---------- SCENARIOS ---------- */
  const SCENARIOS = [
    { id: 'no-accounts',                 label: 'No Accounts',                msg: 'none',            total: '75,000.00',  managed: 'capitalActive', active: 'noAccounts' },
    { id: 'no-capital-add-funds',        label: 'No Capital · Add Funds',     msg: 'none',            total: '75,000.00',  managed: 'capitalActive', active: 'noCapitalAddFunds' },
    { id: 'tfsa-transfer-pending',       label: 'TFSA · Transfer Pending',    msg: 'none',            total: '75,000.00',  managed: 'capitalActive', active: 'tfsaTransferPending' },
    { id: 'core-inactive-tfsa',          label: 'All Inactive · TFSA',        msg: 'none',            total: '0.00',       managed: 'coreInactive',  active: 'tfsaAddFunds' },
    { id: 'active-rrsp',                 label: 'Active · RRSP',              msg: 'rrspSettlement',  total: '152,000.00', managed: 'capitalActive', active: 'activeFull' },
    { id: 'tfsa-opening',                label: 'TFSA · Opening',             msg: 'tfsaOpening',     total: '75,000.00',  managed: 'capitalActive', active: 'tfsaOpening' },
    { id: 'rrsp-opening',                label: 'RRSP · Opening',             msg: 'rrspOpening',     total: '75,000.00',  managed: 'capitalActive', active: 'rrspOpening' },
    { id: 'nonreg-opening',              label: 'Non-Registered · Opening',   msg: 'nonRegOpening',   total: '75,000.00',  managed: 'capitalActive', active: 'nonRegOpening' },
    { id: 'identity-in-review',          label: 'Identity · In Review',       msg: 'idReview',        total: '75,000.00',  managed: 'capitalActive', active: 'tfsaVerifying' },
    { id: 'identity-failed',             label: 'Identity · Failed',          msg: 'idFailed',        total: '75,000.00',  managed: 'capitalActive', active: 'tfsaVerifyFailed' },
  ];

  /* ---------- MESSAGE CENTER ---------- */
  const MESSAGES = {
    none: '',

    rrspSettlement: `
      <div class="callout">
        <p class="eyebrow">Notice</p>
        <p>RRSP cash balance requires settlement.</p>
        <a class="action">Resolve Balance →</a>
      </div>`,

    tfsaOpening: `
      <div class="account-callout">
        <p class="eyebrow">Account opening</p>
        <p class="body">Your self-directed TFSA account is being opened. This usually takes a few minutes.</p>
      </div>
      <div class="callout">
        <p class="eyebrow">Identity review</p>
        <p>Aidan, your identity information is being reviewed. This usually takes less than 5 minutes.</p>
      </div>`,

    rrspOpening: `
      <div class="account-callout">

        <p class="body">Your self-directed RRSP account is being opened. This usually takes a few minutes.</p>
      </div>

        <p class="eyebrow">Identity review</p>
        <p>Aidan, your identity information is being reviewed. This usually takes less than 5 minutes.</p>
      </div>`,

    nonRegOpening: `
      <div class="account-callout">
        <p class="eyebrow">Account opening</p>
        <p class="body">Your self-directed Non-Registered account is being opened. This usually takes a few minutes.</p>
      </div>
      <div class="callout">
        <p class="eyebrow">Identity review</p>
        <p>Aidan, your identity information is being reviewed. This usually takes less than 5 minutes.</p>
      </div>`,

    idReview: `
      <div class="callout">
        <p class="eyebrow">Identity review</p>
        <p>Aidan, your identity information is being reviewed. This usually takes less than 5 minutes.</p>
      </div>`,

    idFailed: `
      <div class="callout">
        <p class="eyebrow">Action required</p>
        <p>There was an issue with the identity information you provided.</p>
        <a class="action">Try Again</a>
      </div>`,
  };

  /* ---------- MANAGED ---------- */
  const coreTitle = `
    <div class="s-title-wrap">
      <div class="s-title-col">
        <span class="t-primary">Core</span>
        <span class="t-secondary">Managed</span>
      </div>
    </div>`;

  const corePortfolioInactive = `
    <div class="pos-group" style="cursor:pointer;">
      <span class="pos-head" style="color:#929292;">Core Portfolio</span>
      <span class="pos-head">Inactive</span>
    </div>`;

  const MANAGED_CONTENT = {
    capitalActive: coreTitle + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>75,000.00</span></span>
        </div>
        <div class="db">
          <span class="db-label">Projection</span>
          <span class="n15" data-final>1.23M</span>

    coreInactive: coreTitle + `<div class="data-col">${corePortfolioInactive}</div>`,

  /* ---------- ACTIVE (SELF-DIRECTED) ---------- */
  const activeTitlePlain = `
    <div class="s-title-wrap">
      <div class="s-title-col">
        <span class="t-primary">Active</span>
        <span class="t-secondary">Self-directed</span>
      </div>
    </div>`;

  const activeTitleWithAccount = (account) => `
    <div class="s-title-wrap">
      <div class="s-title-col">
        <span class="t-primary">Active</span>
        <span class="t-secondary">Self-directed</span>
      </div>
      <div class="acct-sw">
        <span class="acct-label">${account}</span>
        <svg class="acct-chev" viewBox="0 0 7 4" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0.5 0.5L3.5 3.5L6.5 0.5" stroke="#c7c7c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`;

  const activeTitleRRSPFull = `
    <div class="s-title-wrap">
      <div class="s-title-col">
        <span class="t-primary">Active</span>
        <span class="t-secondary">Self-directed</span>
      </div>
      <div class="acct-sw">
        <span class="acct-label">RRSP</span>
        <svg class="acct-chev" viewBox="0 0 7 4" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0.5 0.5L3.5 3.5L6.5 0.5" stroke="#c7c7c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`;

  const noAccountsBlock = `
    <div class="pos-group" style="cursor:pointer;">
      <span class="pos-head" style="color:#929292;">No Accounts</span>
      <span class="pos-head">Open Account</span>
    </div>`;

  const ACTIVE_CONTENT = {
    noAccounts: activeTitlePlain + `<div class="data-col">${noAccountsBlock}</div>`,

    noCapitalAddFunds: activeTitlePlain + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">No Capital Deployed</span>
          <span class="pos-head">Add Funds</span>
        </div>
        <div class="pos-group">
          <span class="pos-head">Under Review   <span data-final>4</span></span>
          <div class="tbl">
            <div class="tbl-row"><span class="tl-mid">ORIO.TO</span></div>
            <div class="tbl-row"><span class="tl-mid">BWEN</span></div>
            <div class="tbl-row"><span class="tl-mid">EOSCR</span></div>
          </div>
          <span class="view-all">View All</span>
        </div>
      </div>`,

    tfsaTransferPending: activeTitleWithAccount('TFSA') + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <div class="pos-group">
          <span class="pos-head" style="color:#929292;">No Capital Deployed</span>
          <span class="pos-head">Transfer Pending</span>
        </div>
      </div>`,

    tfsaAddFunds: activeTitleWithAccount('TFSA') + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">No Capital Deployed</span>
          <span class="pos-head">Add Funds</span>
        </div>
      </div>`,

    activeFull: activeTitleRRSPFull + `
      <div class="data-col" style="gap:53px;">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>77,000.00</span></span>
          <div class="gain-row">
            <span class="gt">All time</span>
            <div class="gain-pair">
              <span class="ga" data-final>+3,875.76</span>
              <span class="gp" data-final>(+5.3%)</span>
            </div>
          </div>
        </div>
        <div class="cash-block">
          <span class="cash-lbl">Cash</span>
          <span class="n15" style="width:auto;" data-final>-15.00</span>
        </div>
        <div class="pos-group">
          <span class="pos-head">Active Positions   <span data-final>9</span></span>
          <div class="tbl">
            <div class="tbl-row"><span class="tl-mid">ORIO.TO</span><span class="tv" data-final>25%</span></div>
            <div class="tbl-row"><span class="tl-mid">BWEN</span>   <span class="tv" data-final>20%</span></div>
            <div class="tbl-row"><span class="tl-mid">EOSCR</span>  <span class="tv" data-final>15%</span></div>
            <div class="tbl-row"><span class="tl-mid">NVDA</span>   <span class="tv" data-final>12%</span></div>
            <div class="tbl-row"><span class="tl-mid">AMD</span>    <span class="tv" data-final>8%</span></div>
          </div>
          <span class="view-all">View All</span>
        </div>
        <div class="pos-group">
          <span class="pos-head">Under Review   <span data-final>4</span></span>
          <div class="tbl">
            <div class="tbl-row"><span class="tl-mid">ORIO.TO</span></div>
            <div class="tbl-row"><span class="tl-mid">BWEN</span></div>
            <div class="tbl-row"><span class="tl-mid">EOSCR</span></div>
          </div>
          <span class="view-all">View All</span>
        </div>
        <div class="open-orders">
          <span class="oo-lbl">Open Orders</span>
          <span class="oo-n" data-final>2</span>
        </div>
      </div>`,

    tfsaOpening: activeTitleWithAccount('TFSA') + `
      <div class="data-col">
        <div class="pos-group">
          <span class="pos-head" style="color:#929292;">TFSA Account</span>
          <span class="pos-head">Opening In Progress</span>
        </div>
      </div>`,

    rrspOpening: activeTitleWithAccount('RRSP') + `
      <div class="data-col">
        <div class="pos-group">
          <span class="pos-head" style="color:#929292;">RRSP Account</span>
          <span class="pos-head">Opening In Progress</span>
        </div>
      </div>`,

    nonRegOpening: activeTitleWithAccount('Non-Registered') + `
      <div class="data-col">
        <div class="pos-group">
          <span class="pos-head" style="color:#929292;">Non-Registered Account</span>
          <span class="pos-head">Opening In Progress</span>
        </div>
      </div>`,

    tfsaVerifying: activeTitleWithAccount('TFSA') + `
      <div class="data-col">
        <div class="pos-group">
          <span class="pos-head" style="color:#929292;">Verification In Progress</span>
          <span class="pos-head">Transfers Unavailable</span>
        </div>
      </div>`,

    tfsaVerifyFailed: activeTitleWithAccount('TFSA') + `
      <div class="data-col">
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">Identity Verification Failed</span>
          <span class="pos-head">Try Again</span>
        </div>
      </div>`,
  };

  /* ---------- RENDER ---------- */
  function render(id) {
    const s = SCENARIOS.find(x => x.id === id) || SCENARIOS[0];
    const msgEl = document.getElementById('msg-center');
    if (MESSAGES[s.msg]) {
      msgEl.innerHTML = MESSAGES[s.msg];
      msgEl.hidden = false;
    } else {
      msgEl.innerHTML = '';
      msgEl.hidden = true;
    }
    document.getElementById('total-capital').innerHTML = `
      <span class="tc-label">Total Value</span>
      <span class="tc-value"><span data-final>${s.total}</span> <span class="tc-ccy">CAD</span></span>`;
    document.getElementById('managed-inner').innerHTML = MANAGED_CONTENT[s.managed];
    document.getElementById('active-inner').innerHTML = ACTIVE_CONTENT[s.active];
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === s.id));
    const url = new URL(window.location);
    url.searchParams.set('s', s.id);
    history.replaceState(null, '', url);
  }

  function buildChips() {
    const bar = document.getElementById('chipBar');
    bar.innerHTML = SCENARIOS.map(s => `<button class="chip" data-id="${s.id}">${s.label}</button>`).join('');
    bar.classList.add('collapsed');
    bar.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      if (btn.classList.contains('active')) { bar.classList.toggle('collapsed'); }
      else { render(btn.dataset.id); bar.classList.add('collapsed'); }
    });
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('embed') === '1') { document.getElementById('chipBar').style.display = 'none'; }
  else { buildChips(); }
  const initial = params.get('s') || SCENARIOS[0].id;
  render(initial);
</script>
</body>
</html>
