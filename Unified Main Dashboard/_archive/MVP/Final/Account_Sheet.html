<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Self-Directed Accounts · Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-1000:  #1C1C1C;
      --c-800:   #565B5E;
      --c-700:   #929292;
      --c-400:   #C7C7C7;
      --c-white: #FFFFFF;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .frame {
      width: 100%;
      max-width: 393px;
      min-height: 100vh;
      position: relative;
    }

    /* Dim background (simulates dashboard behind sheet) */
    .dim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }

    /* Sheet */
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: #141518;
      padding: 20px 24px 40px;
    }
    .sheet-close {
      background: transparent; border: none; cursor: pointer;
      padding: 0; display: block; margin-left: auto;
      width: 20px; height: 20px; line-height: 1;
    }
    .sheet-title { margin-top: 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
    .t-primary   { display: block; font-size: 18px; color: var(--c-400); font-weight: 400; letter-spacing: -0.36px; line-height: 1.15; text-transform: capitalize; }
    .t-secondary { display: block; font-size: 15px; color: #565b5e; font-weight: 400; letter-spacing: -0.3px; line-height: 1.2; text-transform: capitalize; }

    .sheet-list { list-style: none; padding: 0; margin: 0; }
    .sheet-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0; font-size: 15px; color: #fff;
      letter-spacing: -0.3px; cursor: pointer;
      border-bottom: 1px solid #1C1C1C;
      transition: color 120ms ease;
    }
    .sheet-item:hover { color: var(--c-400); }
    .sheet-check { width: 14px; height: 14px; opacity: 0; }
    .sheet-item.active .sheet-check { opacity: 1; }
  </style>
</head>
<body>

<div class="frame">
  <div class="dim"></div>
  <div class="sheet" role="dialog" aria-label="Select self-directed account">
    <button class="sheet-close" aria-label="Close">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
        <path d="M5 5L15 15M15 5L5 15" stroke="#C7C7C7" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="sheet-title">
      <span class="t-primary">Self-Directed</span>
      <span class="t-secondary">Accounts</span>
    </div>
    <ul class="sheet-list" id="sheetList">
      <li class="sheet-item active" data-key="all">
        <span>All Accounts</span>
        <svg class="sheet-check" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </li>
      <li class="sheet-item" data-key="rrsp">
        <span>RRSP</span>
        <svg class="sheet-check" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </li>
      <li class="sheet-item" data-key="tfsa">
        <span>TFSA</span>
        <svg class="sheet-check" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </li>
      <li class="sheet-item" data-key="nonreg">
        <span>Non-Registered</span>
        <svg class="sheet-check" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </li>
    </ul>
  </div>
</div>

<script>
  const list = document.getElementById('sheetList');
  const params = new URLSearchParams(window.location.search);
  const activeKey = params.get('active');
  if (activeKey) {
    list.querySelectorAll('.sheet-item').forEach(x => {
      x.classList.toggle('active', x.dataset.key === activeKey);
    });
  }
  list.addEventListener('click', e => {
    const item = e.target.closest('.sheet-item');
    if (!item) return;
    list.querySelectorAll('.sheet-item').forEach(x => x.classList.remove('active'));
    item.classList.add('active');
  });
</script>
</body>
</html>
