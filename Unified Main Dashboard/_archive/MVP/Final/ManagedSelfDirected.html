<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Managed + Self-Directed · Scenarios</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-black: #000000;
      --c-1000:  #1C1C1C;
      --c-900:   #232627;
      --c-800:   #565B5E;
      --c-700:   #929292;
      --c-600:   #A7A7A7;
      --c-400:   #C7C7C7;
      --c-200:   #E3E2E2;
      --c-white: #FFFFFF;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .frame { width: 100%; max-width: 393px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; text-align: right; padding-bottom: 180px; }

    .header { height: 71px; display: flex; align-items: center; justify-content: space-between; padding: 0 13.5px; border-bottom: 0.5px solid #1C1C1C; }
    .logo { height: 14.4px; width: auto; display: block; }
    .header-icons { display: flex; align-items: center; gap: 20px; }
    .header-icons img { width: 17px; height: 17px; opacity: 0.85; display: block; }
    .header-icons img[alt="menu"] { opacity: 0.4; }

    .total-capital { padding: 0 13.5px; margin-top: 81px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .tc-label { font-size: 13px; color: var(--c-700); letter-spacing: -0.22px; line-height: 1.25; text-transform: capitalize; }
    .tc-value { font-size: 28px; color: #fff; font-feature-settings: 'lnum' 1, 'pnum' 1; line-height: normal; letter-spacing: -0.56px; }
    .tc-ccy { color: var(--c-800); }

    .divider { border: none; border-top: 1px solid #1C1C1C; margin: 0 13.5px; }
    .section { padding: 30px 13.5px 0; }
    .s-inner { display: flex; flex-direction: column; gap: 50px; }
    .s-title-wrap { display: flex; align-items: flex-start; justify-content: space-between; }
    .s-title-col { display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .t-primary   { font-size: 18px; color: var(--c-400); font-weight: 400; letter-spacing: -0.36px; line-height: 1.15; text-transform: capitalize; }
    .t-secondary { font-size: 15px; color: #565b5e; font-weight: 400; letter-spacing: -0.3px; line-height: 1.2; text-transform: capitalize; }

    .data-col { display: flex; flex-direction: column; align-items: flex-end; gap: 50px; width: 100%; }
    .db { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; }
    .db-label { font-size: 13px; color: var(--c-700); letter-spacing: -0.22px; line-height: 1.25; text-transform: capitalize; width: 100%; }
    .n22 { font-size: 22px; color: #fff; font-feature-settings: 'lnum' 1, 'pnum' 1; line-height: normal; width: 100%; letter-spacing: -0.44px; }
    .n15 { font-size: 15px; color: var(--c-400); font-feature-settings: 'lnum' 1, 'tnum' 1; line-height: normal; width: 100%; letter-spacing: -0.3px; }

    .gain-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; font-size: 13px; white-space: nowrap; }
    .gain-pair { display: flex; align-items: center; gap: 4px; }
    .ga { color: var(--c-400); font-feature-settings: 'lnum' 1, 'tnum' 1; }
    .gp { color: #c7c7c7; font-feature-settings: 'lnum' 1, 'tnum' 1; }
    .gt { color: #929292; text-transform: capitalize; }

    .tbl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; font-size: 13px; text-transform: capitalize; white-space: nowrap; }
    .tbl-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .tl { color: #929292; }
    .tl-mid { color: var(--c-700); }
    .tv { color: var(--c-400); font-feature-settings: 'lnum' 1, 'tnum' 1; }

    .cash-block { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; white-space: nowrap; }
    .cash-lbl { font-size: 13px; color: #929292; text-transform: capitalize; line-height: normal; }

    .acct-sw { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .acct-label { font-size: 15px; color: #c7c7c7; letter-spacing: -0.3px; line-height: 1.35; text-transform: capitalize; }
    .acct-chev { width: 7px; height: 4px; display: block; }

    .pos-group { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; width: 100%; }
    .pos-head { font-size: 15px; color: var(--c-400); letter-spacing: -0.3px; line-height: 1.15; text-transform: capitalize; width: 100%; white-space: pre-wrap; }
    .view-all { font-size: 13px; color: var(--c-400); text-transform: capitalize; line-height: normal; width: 100%; cursor: pointer; }
    .open-orders { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; font-size: 15px; letter-spacing: -0.3px; line-height: 1.15; text-transform: capitalize; white-space: nowrap; }
    .oo-lbl { color: #c7c7c7; }
    .oo-n { color: #c7c7c7; font-feature-settings: 'lnum' 1, 'tnum' 1; }

    .mt-managed { margin-top: 70px; }
    .mt-active  { margin-top: 70px; }

    [data-final] { font-variant-numeric: tabular-nums; }
    .header, .total-capital, .mt-managed, .mt-active { animation: fade-in 700ms ease-out both; }
    .header        { animation-delay:   0ms; }
    .total-capital { animation-delay: 150ms; }
    .mt-managed    { animation-delay: 350ms; }
    .mt-active     { animation-delay: 550ms; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .header, .total-capital, .mt-managed, .mt-active { animation: none; } }

    /* ACCOUNT SHEET */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none; transition: opacity 200ms ease;
      z-index: 200;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%);
      width: 100%; max-width: 393px; background: #141518;
      padding: 20px 24px 40px;
      transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 201;
    }
    .sheet-overlay.open .sheet { transform: translate(-50%, 0); }
    .sheet-close {
      background: transparent; border: none; color: var(--c-400);
      cursor: pointer; padding: 0; display: block; margin-left: auto;
      width: 20px; height: 20px; line-height: 1;
    }
    .sheet-title {
      margin-top: 12px; margin-bottom: 16px;
    }
    .sheet-title .t-primary { display: block; text-transform: none; }
    .sheet-title .t-secondary { display: block; text-transform: none; }
    .sheet-list { list-style: none; padding: 0; margin: 0; }
    .sheet-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0; font-size: 15px; color: #fff;
      letter-spacing: -0.3px; cursor: pointer;
      border-bottom: 1px solid #1C1C1C;
      transition: color 120ms ease;
    }
    .sheet-item:hover { color: var(--c-400); }
    .sheet-check { width: 14px; height: 14px; opacity: 0; color: #fff; }
    .sheet-item.active .sheet-check { opacity: 1; }

    /* CHIP BAR */
    .chip-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 18, 20, 0.92); border: 1px solid #232627; border-radius: 100px;
      padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 10px;
      max-width: min(1100px, 94vw); justify-content: center;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100;
    }
    .chip {
      padding: 6px 12px; font-size: 12px; color: #929292;
      background: transparent; border: none; border-radius: 20px; cursor: pointer;
      white-space: nowrap; letter-spacing: -0.01em; font-family: inherit;
      transition: color 120ms ease, background 120ms ease;
    }
    .chip:hover { color: #fff; }
    .chip.active { background: #fff; color: #000; font-weight: 500; }
    .chip-bar.collapsed .chip:not(.active) { display: none; }
    .chip.active { cursor: pointer; }
    .chip.active::after { content: "▾"; margin-left: 6px; font-size: 10px; opacity: 0.6; }
    .chip-bar:not(.collapsed) .chip.active::after { content: "▴"; }
  </style>
</head>
<body>

<div class="frame">
  <header class="header">
    <img class="logo" src="Logo.svg" alt="logo">
    <div class="header-icons">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg" alt="search"><circle cx="7.5" cy="7.5" r="5.5" stroke="#D9D9D9" stroke-width="1"/><path d="M11.5 11.5L15.5 15.5" stroke="#D9D9D9" stroke-width="1" stroke-linecap="round"/></svg>
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg" alt="menu"><path d="M2 4H15M2 9H15M2 14H15" stroke="#666666" stroke-width="1" stroke-linecap="round"/></svg>
    </div>
  </header>

  <div class="total-capital" id="total-capital"></div>

  <div class="mt-managed">
    <hr class="divider">
    <div class="section"><div class="s-inner" id="managed-inner"></div></div>
  </div>

  <div class="mt-active">
    <hr class="divider">
    <div class="section"><div class="s-inner" id="active-inner"></div></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" role="dialog" aria-label="Select self-directed account">
    <button class="sheet-close" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
        <path d="M5 5L15 15M15 5L5 15" stroke="#C7C7C7" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="sheet-title">
      <span class="t-primary">Self-Directed</span>
      <span class="t-secondary">Accounts</span>
    </div>
    <ul class="sheet-list" id="sheetList"></ul>
  </div>
</div>

<nav class="chip-bar" id="chipBar"></nav>

<script>
  const SCENARIOS = [
    { id: 'fully-active-orders',    label: 'Fully Active · With Orders',            total: '152,000.00', managed: 'capitalActive',  active: 'activeFullOrders' },
    { id: 'fully-active-no-orders', label: 'Fully Active · No Orders',              total: '152,000.00', managed: 'capitalActive',  active: 'activeFullNoOrders' },
    { id: 'no-capital',             label: 'No Capital',                            total: '0.00',       managed: 'coreInactiveValue', active: 'noCapitalAddFunds' },
    { id: 'no-accounts',            label: 'No Accounts',                           total: '0.00',       managed: 'coreInactive',   active: 'noAccounts' },
    { id: 'no-managed-sched-no-sd', label: 'No Managed Schedule · No SD Accounts',  total: '0.00',       managed: 'coreInactiveValue', active: 'noAccounts' },
    { id: 'managed-sched-no-accts', label: 'Managed Scheduled · No SD Accounts',    total: '0.00',       managed: 'coreInactiveScheduled', active: 'noAccounts' },
  ];

  /* MANAGED content */
  const coreTitleLong = `
    <div class="s-title-wrap">
      <div class="s-title-col"><span class="t-primary">Core</span><span class="t-secondary">Managed</span></div>
    </div>`;

  const MANAGED_CONTENT = {
    capitalActive: coreTitleLong + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>75,000.00</span></span>
        </div>
        <div class="db">
          <span class="db-label">Projection</span>
          <span class="n15" data-final>1.23M</span>
        </div>
      </div>`,

    coreInactive: coreTitleLong + `
      <div class="data-col">
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">Core Portfolio</span>
          <span class="pos-head">Inactive</span>
        </div>
      </div>`,

    coreInactiveValue: coreTitleLong + `
      <div class="data-col">
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">Core Portfolio</span>
          <span class="pos-head">Inactive</span>
        </div>
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <span class="view-all">No Capital Deployed</span>
      </div>`,

    coreInactiveScheduled: coreTitleLong + `
      <div class="data-col">
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">Core Portfolio</span>
          <span class="pos-head">Inactive</span>
        </div>
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <span class="view-all">First Investment Scheduled</span>
      </div>`,

    projectedScheduled: coreTitleLong + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <div class="db">
          <span class="db-label">Projection</span>
          <span class="n15" data-final>1.23M</span>
        </div>
        <span class="view-all">First Investment Scheduled</span>
      </div>`,
  };

  /* ACTIVE (Self-Directed) content */
  const activeTitlePlain = `
    <div class="s-title-wrap">
      <div class="s-title-col"><span class="t-primary">Active</span><span class="t-secondary">Self-directed</span></div>
    </div>`;

  const activeTitleAccounts = (accountLabel) => `
    <div class="s-title-wrap">
      <div class="s-title-col"><span class="t-primary">Active</span><span class="t-secondary">Self-directed</span></div>
      <div class="acct-sw" id="acctSw" role="button" tabindex="0">
        <span class="acct-label" id="acctLabel">${accountLabel}</span>
        <svg class="acct-chev" viewBox="0 0 7 4" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0.5 0.5L3.5 3.5L6.5 0.5" stroke="#c7c7c7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`;

  /* Per-account data */
  const ACCOUNTS = {
    all: { label: 'All Accounts', total: '152,000.00', value: '77,000.00', gain: '+3,875.76', pct: '(+5.3%)', cash: '7,700.00', positions: 9, review: 4, orders: 2,
           holdings: [['ORIO.TO','25%'],['BWEN','20%'],['EOSCR','15%'],['NVDA','12%'],['AMD','8%']],
           reviewing: ['ORIO.TO','BWEN','EOSCR'] },
    rrsp: { label: 'RRSP', total: '115,000.00', value: '40,000.00', gain: '+1,920.00', pct: '(+5.0%)', cash: '4,000.00', positions: 5, review: 2, orders: 1,
           holdings: [['ORIO.TO','35%'],['NVDA','25%'],['BWEN','20%'],['EOSCR','15%'],['AMD','5%']],
           reviewing: ['ORIO.TO','NVDA'] },
    tfsa: { label: 'TFSA', total: '100,000.00', value: '25,000.00', gain: '+1,250.00', pct: '(+5.2%)', cash: '2,500.00', positions: 3, review: 1, orders: 1,
           holdings: [['BWEN','45%'],['EOSCR','30%'],['AMD','25%']],
           reviewing: ['BWEN'] },
    nonreg: { label: 'Non-Registered', total: '87,000.00', value: '12,000.00', gain: '+705.76', pct: '(+6.2%)', cash: '1,200.00', positions: 1, review: 1, orders: 0,
           holdings: [['NVDA','100%']],
           reviewing: ['NVDA'] },
  };
  let CURRENT_ACCOUNT = 'all';

  function activeFullInner(acc) {
    const holdings = acc.holdings.map(([t, p]) =>
      `<div class="tbl-row"><span class="tl-mid">${t}</span><span class="tv" data-final>${p}</span></div>`
    ).join('');
    const reviewing = acc.reviewing.map(t =>
      `<div class="tbl-row"><span class="tl-mid">${t}</span></div>`
    ).join('');
    return `
      <div class="db">
        <span class="db-label">Value</span>
        <span class="n22"><span data-final>${acc.value}</span></span>
        <div class="gain-row">
          <span class="gt">All time</span>
          <div class="gain-pair">
            <span class="ga" data-final>${acc.gain}</span>
            <span class="gp" data-final>${acc.pct}</span>
          </div>
        </div>
      </div>
      <div class="cash-block">
        <span class="cash-lbl">Cash (10%)</span>
        <span class="n15" style="width:auto;" data-final>${acc.cash}</span>
      </div>
      <div class="pos-group">
        <span class="pos-head">Active Positions   <span data-final>${acc.positions}</span></span>
        <div class="tbl">${holdings}</div>
        <span class="view-all">View All</span>
      </div>
      <div class="pos-group">
        <span class="pos-head">Under Review   <span data-final>${acc.review}</span></span>
        <div class="tbl">${reviewing}</div>
        <span class="view-all">View All</span>
      </div>`;
  }

  const openOrdersBlock = (n) => n > 0 ? `
      <div class="open-orders">
        <span class="oo-lbl">Open Orders</span>
        <span class="oo-n" data-final>${n}</span>
      </div>` : '';

  function activeFullMarkup(withOrders) {
    const acc = ACCOUNTS[CURRENT_ACCOUNT];
    const orders = withOrders ? openOrdersBlock(acc.orders) : '';
    return activeTitleAccounts(acc.label) + `<div class="data-col" style="gap:53px;">${activeFullInner(acc)}${orders}</div>`;
  }

  const ACTIVE_CONTENT = {
    get activeFullOrders()   { return activeFullMarkup(true); },
    get activeFullNoOrders() { return activeFullMarkup(false); },

    noCapitalAddFunds: activeTitlePlain + `
      <div class="data-col">
        <div class="db">
          <span class="db-label">Value</span>
          <span class="n22"><span data-final>0.00</span></span>
        </div>
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">No Capital Deployed</span>
          <span class="pos-head">Add Funds</span>
        </div>
      </div>`,

    noAccounts: activeTitlePlain + `
      <div class="data-col">
        <div class="pos-group" style="cursor:pointer;">
          <span class="pos-head" style="color:#929292;">No Accounts</span>
          <span class="pos-head">Open Account</span>
        </div>
      </div>`,
  };

  let CURRENT_SCENARIO = null;

  function render(id) {
    const s = SCENARIOS.find(x => x.id === id) || SCENARIOS[0];
    CURRENT_SCENARIO = s;
    const isActive = s.active === 'activeFullOrders' || s.active === 'activeFullNoOrders';
    const totalValue = isActive ? ACCOUNTS[CURRENT_ACCOUNT].total : s.total;
    document.getElementById('total-capital').innerHTML = `
      <span class="tc-label">Total Value</span>
      <span class="tc-value"><span data-final>${totalValue}</span> <span class="tc-ccy">CAD</span></span>`;
    document.getElementById('managed-inner').innerHTML = MANAGED_CONTENT[s.managed];
    document.getElementById('active-inner').innerHTML = ACTIVE_CONTENT[s.active];
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === s.id));
    wireAccountDropdown();
    const url = new URL(window.location);
    url.searchParams.set('s', s.id);
    history.replaceState(null, '', url);
  }

  function buildChips() {
    const bar = document.getElementById('chipBar');
    bar.innerHTML = SCENARIOS.map(s => `<button class="chip" data-id="${s.id}">${s.label}</button>`).join('');
    bar.classList.add('collapsed');
    bar.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      if (btn.classList.contains('active')) { bar.classList.toggle('collapsed'); }
      else { render(btn.dataset.id); bar.classList.add('collapsed'); }
    });
  }

  /* ACCOUNT SHEET */
  const sheetOverlay = document.getElementById('sheetOverlay');
  const sheetList = document.getElementById('sheetList');
  const sheetClose = document.getElementById('sheetClose');

  function buildSheet() {
    sheetList.innerHTML = Object.entries(ACCOUNTS).map(([key, a]) => `
      <li class="sheet-item${key === CURRENT_ACCOUNT ? ' active' : ''}" data-key="${key}">
        <span>${a.label}</span>
        <svg class="sheet-check" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </li>`).join('');
  }

  function openSheet() { buildSheet(); sheetOverlay.classList.add('open'); }
  function closeSheet() { sheetOverlay.classList.remove('open'); }

  sheetOverlay.addEventListener('click', e => { if (e.target === sheetOverlay) closeSheet(); });
  sheetClose.addEventListener('click', closeSheet);
  sheetList.addEventListener('click', e => {
    const item = e.target.closest('.sheet-item');
    if (!item) return;
    CURRENT_ACCOUNT = item.dataset.key;
    closeSheet();
    if (CURRENT_SCENARIO) render(CURRENT_SCENARIO.id);
  });

  function wireAccountDropdown() {
    const sw = document.getElementById('acctSw');
    if (!sw) return;
    sw.addEventListener('click', openSheet);
    sw.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('embed') === '1') { document.getElementById('chipBar').style.display = 'none'; }
  else { buildChips(); }
  const initial = params.get('s') || SCENARIOS[0].id;
  render(initial);
</script>
</body>
</html>
