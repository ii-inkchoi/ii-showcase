<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard V7 — Font Comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 0.5px solid #1C1C1C;
      padding: 12px 20px 0;
      background: #0a0a0a;
      flex-shrink: 0;
    }
    .tab {
      background: transparent;
      border: none;
      color: #565B5E;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: -0.2px;
      padding: 10px 18px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      margin-bottom: -0.5px;
      transition: color 0.12s, border-color 0.12s;
      text-transform: uppercase;
    }
    .tab .sub {
      display: block;
      font-size: 10px;
      color: #3a3a3a;
      margin-top: 4px;
      text-transform: none;
      letter-spacing: 0;
    }
    .tab:hover { color: #C7C7C7; }
    .tab.active {
      color: #fff;
      border-bottom-color: #fff;
    }
    .tab.active .sub { color: #929292; }
    .frame-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 0;
      overflow: auto;
    }
    iframe {
      width: 393px;
      min-height: 1800px;
      border: none;
      background: #000;
      display: block;
    }
    .replay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1C1C1C;
      color: #C7C7C7;
      border: 0.5px solid #565B5E;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-radius: 2px;
    }
    .replay:hover { color: #fff; border-color: #C7C7C7; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-src="dashboard-v7.html">
      BASELINE
      <span class="sub">Inter · no display/mono system</span>
    </button>
    <button class="tab" data-src="dashboard-v7-font-a.html">
      A · OPERATOR
      <span class="sub">Inter + Söhne + IBM Plex Mono</span>
    </button>
    <button class="tab" data-src="dashboard-v7-font-b.html">
      B · CLINICAL LUXURY
      <span class="sub">Helvetica Neue + Canela + SF Mono</span>
    </button>
    <button class="tab" data-src="dashboard-v7-font-c.html">
      C · TERMINAL
      <span class="sub">IBM Plex Sans + Neue Haas + JetBrains Mono</span>
    </button>
  </div>
  <div class="frame-wrap">
    <iframe id="frame" src="dashboard-v7.html" title="Dashboard Preview"></iframe>
  </div>
  <button class="replay" id="replay">↻ Replay Animation</button>

  <script>
    const frame = document.getElementById('frame');
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        tabs.forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        frame.src = t.dataset.src;
      });
    });
    document.getElementById('replay').addEventListener('click', () => {
      const active = document.querySelector('.tab.active');
      frame.src = active.dataset.src + '?t=' + Date.now();
    });
  </script>
</body>
</html>
