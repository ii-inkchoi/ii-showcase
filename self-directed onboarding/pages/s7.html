<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>7 · Condition for Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="screen" id="s7">
    <div class="screen-header">
      <div class="top-bar">
        <button type="button" class="back-btn" onclick="goBack()">
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M6 1L1 6L6 11" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="exit-btn hidden"></button>
      </div>
      <div class="top-divider"></div>
    </div>
    <div class="fig-main fig-main--input">
      <p class="t18-w" style="max-width:255px;">Activity is not the objective.</p>
      <div class="fig-line-group" style="margin-bottom:0;">
        <p class="t14-400">A trade is not progress.</p>
        <p class="t14-400">Access is not edge.</p>
        <p class="t14-400">Action without a clear condition is usually noise.</p>
      </div>
      <label class="input-label" for="s7input">Before opening a position, what must be true?</label>
      <textarea class="text-input" id="s7input" rows="2" maxlength="180" oninput="checkTextInput('s7input','s7btn')"></textarea>
      <p class="input-note">Write a condition you can verify.</p>
      <p class="input-count" data-for="s7input">0/180</p>
    </div>
    <div class="cta-bar">
      <button type="button" class="arrow-btn" id="s7btn" onclick="saveState({s7:document.getElementById('s7input').value.trim()}); goTo('s8.html')" disabled>
        <svg width="36" height="14" viewBox="0 0 36 14" fill="none"><path d="M0 7H34M27 1L34 7L27 13" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  const s = loadState();
  if (s.s7) { document.getElementById('s7input').value = s.s7; checkTextInput('s7input','s7btn'); }
  initScreen('s7');
</script>
</body>
</html>
