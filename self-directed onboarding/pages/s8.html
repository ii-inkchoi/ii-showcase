<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8 · Condition for Reconsideration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="screen" id="s8">
    <div class="screen-header">
      <div class="top-bar">
        <button type="button" class="back-btn" onclick="goBack()">
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M6 1L1 6L6 11" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="exit-btn hidden"></button>
      </div>
      <div class="top-divider"></div>
    </div>
    <div class="fig-main fig-main--scroll">
      <p class="t18-w" style="max-width:280px;">A position should not be reviewed because price moved.</p>
      <p class="t14-700" style="margin-bottom:24px;">Price movement is common.<br>A broken thesis is different.</p>
      <p class="t14-800" style="margin-bottom:20px;">What should cause you to reconsider a position?</p>
      <div class="check-list" id="s8checks">
        <div class="check-row" onclick="toggleCheck(this,'s8checks','s8btn')"><span class="check-label">New information</span><div class="check-box"></div></div>
        <div class="check-row" onclick="toggleCheck(this,'s8checks','s8btn')"><span class="check-label">Thesis broken</span><div class="check-box"></div></div>
        <div class="check-row" onclick="toggleCheck(this,'s8checks','s8btn')"><span class="check-label">Valuation materially changed</span><div class="check-box"></div></div>
        <div class="check-row" onclick="toggleCheck(this,'s8checks','s8btn')"><span class="check-label">Position became too large</span><div class="check-box"></div></div>
        <div class="check-row" onclick="toggleCheck(this,'s8checks','s8btn')"><span class="check-label">Need for liquidity</span><div class="check-box"></div></div>
        <div class="check-row" onclick="toggleCheck(this,'s8checks','s8btn')"><span class="check-label">Price volatility alone</span><div class="check-box"></div></div>
      </div>
    </div>
    <div class="cta-bar">
      <button type="button" class="arrow-btn" id="s8btn" onclick="saveState({s8:getCheckedLabels('s8checks')}); goTo('s9.html')" disabled>
        <svg width="36" height="14" viewBox="0 0 36 14" fill="none"><path d="M0 7H34M27 1L34 7L27 13" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  (function(){
    const saved = (loadState().s8) || [];
    document.querySelectorAll('#s8checks .check-row').forEach(row => {
      const label = row.querySelector('.check-label').textContent.trim();
      if (saved.includes(label)) row.classList.add('sel');
    });
    if (saved.length) document.getElementById('s8btn').disabled = false;
  })();
  initScreen('s8');
</script>
</body>
</html>
