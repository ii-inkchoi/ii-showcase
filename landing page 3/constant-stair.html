<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>II · The Constant (clean)</title>
<style>
  :root{ --c-black:#000000; --c-cream:#F4F2EB; }
  html,body{margin:0;padding:0;background:var(--c-black);}
  #wrap{width:1004px;height:1203px;margin:0 auto;background:var(--c-cream);}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="2008" height="2406" aria-label="The Constant, held line rising through a dot field"></canvas></div>
<script>
/* II · The Constant, clean homepage version, extracted from managed-core-variants N11.
   Light dot field + a single held green staircase rising corner to corner. No numeral, no labels. Static. */
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=cv.width, H=cv.height;                 // 2x for crispness
  var GROUND='#ECEAE5';                          // light plate, slightly off the page cream
  var DOT='rgba(32,31,30,0.30)';                 // faint ink dots
  var GREEN='48,209,88';
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,W,H);

  var cell = Math.round(W/58);                   // uniform grid; density from dot size only
  var nx = Math.floor(W/cell), ny = Math.floor(H/cell);
  var ox = (W - nx*cell)/2 + cell/2, oy = (H - ny*cell)/2 + cell/2;

  // staircase geometry: 12 square steps, corner-to-corner, centred vertically
  var nSteps=12, stepW=W/nSteps, stepH=stepW, rise=nSteps*stepH;
  var baseY=(H+rise)/2, topY=baseY-rise;
  var treadHalf=cell*1.05, riserHalf=cell*1.05;

  function stairStep(X,Y){                        // returns step index if (X,Y) is on the held line, else -1
    if(X<-riserHalf||X>nSteps*stepW+riserHalf) return -1;
    var si=Math.min(nSteps-1,Math.floor(X/stepW));
    var treadY=baseY-(si+1)*stepH;
    if(Math.abs(Y-treadY)<=treadHalf) return si;
    var k=Math.round(X/stepW);
    if(k>=1&&k<=nSteps-1&&Math.abs(X-k*stepW)<=riserHalf){
      var yTop=baseY-(k+1)*stepH, yBot=baseY-k*stepH;
      if(Y>=yTop-treadHalf&&Y<=yBot+treadHalf) return k-1;
    }
    return -1;
  }

  var faintR=cell*0.11+1.1, greenR=cell*0.42;
  for(var iy=0; iy<ny; iy++){
    var y=oy+iy*cell;
    for(var ix=0; ix<nx; ix++){
      var x=ox+ix*cell;
      var step=stairStep(x,y);
      if(step>=0){
        // held line: bottom steps pale, climbing to full green at the top (the rule widening each week)
        var t=step/(nSteps-1);
        var a=0.30+0.65*t;
        ctx.fillStyle='rgba('+GREEN+','+a.toFixed(3)+')';
        ctx.beginPath(); ctx.arc(x,y,greenR,0,6.28); ctx.fill();
      } else {
        ctx.fillStyle=DOT;
        ctx.beginPath(); ctx.arc(x,y,faintR,0,6.28); ctx.fill();
      }
    }
  }
})();
</script>
</body>
</html>
