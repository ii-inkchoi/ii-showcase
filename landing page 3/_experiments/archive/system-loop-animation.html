<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>II - Operating Loop Animation (for marketing)</title>
<!--
  Standalone operating-loop animation for II (Intelligent Investing).
  For marketing: open this file in a browser, press full screen (F11 / green button),
  then screen-record the window to drop the clip into the blank section of the video.
  - Background is solid black (matches the brand). Need transparent? Ask and I'll export a transparent build.
  - Resize the browser window to match your video's aspect (16:9, 1:1, 9:16) - the loop re-centers and re-scales automatically.
  - Loops forever, no start/end - cut any segment you like.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --c-black: #000000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--c-black); overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  #sysLoopCanvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="sysLoopCanvas"></canvas>
  </div>
<script>
  /* Operating loop - ported verbatim from the II landing hero/System renderer.
     Only the composition was adjusted for standalone use: centered (cx = W*0.5) and radius scaled to the shorter viewport edge so it never clips across aspect ratios. */
  (function(){
    const cv=document.getElementById('sysLoopCanvas'); if(!cv)return; const ctx=cv.getContext('2d');let W,H,DPR,cx,cy;
    const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FZ=1.6; // label zoom - enlarges station names/numbers without changing the diagram size
    function resize(){const box=cv.parentElement.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=box.width/FZ;H=box.height/FZ;cv.width=box.width*DPR;cv.height=box.height*DPR;ctx.setTransform(DPR*FZ,0,0,DPR*FZ,0,0);cx=W*0.5;cy=H/2;}
    addEventListener('resize',resize);resize();
    const ST=['Classification','Sizing','Investment Case','Decision Record','Re-underwriting','Calibration'];
    const CASE=2,REUND=4,CAL=5,SEG=6.28/6,th0=-Math.PI/2,stT=i=>th0+i*SEG;
    const sc=()=>Math.min(W,H),R=()=>sc()*0.27,rt=()=>sc()*0.052;const TILT=0.95;let yaw=0;
    function rot(p){let{x,y,z}=p,c1=Math.cos(TILT),s1=Math.sin(TILT),y1=y*c1-z*s1,z1=y*s1+z*c1,c2=Math.cos(yaw),s2=Math.sin(yaw);return{x:x*c2+z1*s2,y:y1,z:-x*s2+z1*c2}}
    function prj(p){const cz=sc()*1.05,f=cz/(cz-p.z);return{sx:cx+p.x*f,sy:cy+p.y*f,d:p.z,f}}
    function tor(t,ph,rr){const r=rr===undefined?rt():rr,rad=R()+r*Math.cos(ph);return{x:rad*Math.cos(t),y:rad*Math.sin(t),z:r*Math.sin(ph)}}
    const SIG={green:'88,150,112',amber:'176,136,58',red:'176,84,74'};function ph2(t,i){let d=(t-stT(i))%6.28;if(d<0)d+=6.28;return d}
    const N=RM?500:1400,nodes=[];
    for(let i=0;i<N;i++)nodes.push({t:Math.random()*6.28,ph:Math.random()*6.28,rj:.55+Math.random()*.75,sp:.08+Math.random()*.1,sz:.7+Math.random()*1.1,tw:Math.random()*6.28,health:.5+Math.random()*.5,isSig:Math.random()<.14,pc:0,pr:0,flash:null});
    const pulses=[0,.33,.66];let t0=performance.now();
    const BIAS=['Narrative','Overconfidence','Confirmation','Hindsight','Anchoring','Self-deception'];
    let biasIdx=0, biasClock=0; const BIAS_DUR=3.4;
    function frame(now){const dt=Math.min(40,now-t0)/1000;t0=now;yaw=RM?0.14:0.10+0.22*Math.sin(now*0.00017);
      ctx.clearRect(0,0,W,H);
      ctx.lineWidth=1;ctx.strokeStyle='rgba(150,150,156,0.28)';ctx.beginPath();
      for(let a=0;a<=110;a++){const t=(a/110)*6.28,p=prj(rot(tor(t,0,0)));a===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy)}ctx.stroke();
      ctx.lineWidth=1;ctx.strokeStyle='rgba(244,243,240,0.5)';ctx.setLineDash([4,5]);ctx.beginPath();
      for(let a=0;a<=110;a++){const t=(a/110)*6.28,p=prj(rot({x:R()*0.60*Math.cos(t),y:R()*0.60*Math.sin(t),z:0}));a===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy)}ctx.stroke();ctx.setLineDash([]);
      const sp=ST.map((s,i)=>prj(rot(tor(stT(i),0,0))));
      ctx.strokeStyle='rgba(244,243,240,0.22)';ctx.lineWidth=1;
      for(let i=0;i<6;i++){const t=stT(i),outer=prj(rot(tor(t,0,0))),inner=prj(rot({x:R()*0.60*Math.cos(t),y:R()*0.60*Math.sin(t),z:0}));
        ctx.beginPath();ctx.moveTo(outer.sx,outer.sy);ctx.lineTo(inner.sx,inner.sy);ctx.stroke();}
      ctx.save();ctx.shadowColor='rgba(5,4,3,0.95)';ctx.shadowBlur=8;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='10.5px "Chakra Petch",ui-monospace,Menlo,monospace';ctx.fillStyle='rgba(244,243,240,0.9)';
      ctx.fillText('S&P 500', cx, cy-7); ctx.fillStyle='rgba(150,150,154,0.8)'; ctx.fillText('the benchmark', cx, cy+7);ctx.restore();
      for(const n of nodes){n.t+=n.sp*dt;n.health+=(Math.random()-.52)*.02*dt*10;if(n.health>1)n.health=1;if(n.health<.06)n.health=.06;
        if(n.isSig){const pc=ph2(n.t,CAL);if(n.pc>5.5&&pc<.8){const hit=Math.random()<(.45+.5*n.health);n.flash=hit?{rgb:SIG.green,l:0,d:1.6}:{rgb:SIG.red,l:0,d:1.6};n.health=hit?Math.min(1,n.health+.12):Math.max(.06,n.health-.28)}n.pc=pc;
          const pr=ph2(n.t,REUND);if(n.pr>5.5&&pr<.8&&n.health<.62)n.flash={rgb:SIG.amber,l:0,d:1.4};n.pr=pr}
        const p=prj(rot(tor(n.t,n.ph,rt()*n.rj))),dn=p.d/(sc()*.42),dA=.18+.4*((dn+1)/2);
        let fire=0;for(let i=0;i<6;i++){let d=Math.abs((n.t-stT(i))%6.28);d=Math.min(d,6.28-d);if(d<.09)fire=Math.max(fire,1-d/.09)}
        const tw=.84+.16*Math.sin(now*.004+n.tw),hK=.32+.68*n.health,a=Math.min(1,dA*tw*hK+fire*.45),s=(n.sz*p.f*.9)*(1+fire*1.1),g=206+Math.round(28*n.health);
        ctx.fillStyle=fire>.15?`rgba(244,243,240,${a})`:`rgba(${g},${g+2},${g+6},${a*.92})`;ctx.fillRect(p.sx-s/2,p.sy-s/2,s,s);
        if(n.flash){n.flash.l+=dt;const k=n.flash.l/n.flash.d;if(k>=1)n.flash=null;else{const fl=Math.sin(Math.min(1,k*1.1)*Math.PI);ctx.fillStyle=`rgba(${n.flash.rgb},${fl*.95})`;ctx.beginPath();ctx.arc(p.sx,p.sy,(s+1.4+fl*1.8)*.6,0,6.28);ctx.fill()}}}
      const A=sp[CAL],B=sp[CASE],ctrl={sx:(A.sx+B.sx)/2*.62+cx*.38,sy:(A.sy+B.sy)/2*.62+cy*.38};
      ctx.lineWidth=1.8;ctx.strokeStyle='rgba(244,243,240,0.6)';ctx.beginPath();ctx.moveTo(A.sx,A.sy);ctx.quadraticCurveTo(ctrl.sx,ctrl.sy,B.sx,B.sy);ctx.stroke();
      for(let i=0;i<pulses.length;i++){pulses[i]+=dt*.16;if(pulses[i]>1)pulses[i]-=1;const t=pulses[i],it=1-t,px=it*it*A.sx+2*it*t*ctrl.sx+t*t*B.sx,py=it*it*A.sy+2*it*t*ctrl.sy+t*t*B.sy,gl=Math.sin(t*Math.PI);ctx.fillStyle=`rgba(244,243,240,${.85*gl})`;ctx.beginPath();ctx.arc(px,py,2.4,0,6.28);ctx.fill()}
      ctx.textBaseline='middle';
      {
        const C=sp[CASE], rdx=C.sx-cx, rdy=C.sy-cy, rl=Math.hypot(rdx,rdy)||1;
        const rx=C.sx+(rdx/rl)*74, ry=C.sy+(rdy/rl)*74;
        ctx.strokeStyle='rgba(96,124,152,0.45)';ctx.lineWidth=1.4;ctx.setLineDash([1,3]);
        ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(C.sx,C.sy);ctx.stroke();ctx.setLineDash([]);
        for(let k=0;k<2;k++){let fp=(now*0.00028+k*0.5)%1;const fx=rx+(C.sx-rx)*fp,fy=ry+(C.sy-ry)*fp,gl=Math.sin(fp*Math.PI);
          ctx.fillStyle=`rgba(110,146,178,${0.9*gl})`;ctx.beginPath();ctx.arc(fx,fy,2,0,6.28);ctx.fill();}
        ctx.fillStyle='rgba(110,146,178,0.95)';ctx.fillRect(rx-3,ry-3,6,6);
        ctx.save();ctx.shadowColor='rgba(5,4,3,0.95)';ctx.shadowBlur=8;
        const rRight=rx>=cx;ctx.textAlign=rRight?'left':'right';const rlx=rx+(rRight?9:-9);
        ctx.font='9.5px "Chakra Petch",ui-monospace,Menlo,monospace';ctx.fillStyle='rgba(110,146,178,0.9)';ctx.fillText('UPSTREAM',rlx,ry-9);
        ctx.font='400 12.5px "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif';ctx.fillStyle='rgba(150,180,205,1)';ctx.fillText('Research',rlx,ry+4);
        ctx.font='9.5px "Chakra Petch",ui-monospace,Menlo,monospace';ctx.fillStyle='rgba(108,120,132,0.9)';ctx.fillText('Fiscal.ai + AI · feeds the case',rlx,ry+16);
        ctx.restore();
      }
      for(let i=0;i<6;i++){const p=sp[i],isR=(i===CAL||i===CASE);ctx.beginPath();ctx.arc(p.sx,p.sy,3.4,0,6.28);ctx.fillStyle=isR?'rgba(244,243,240,0.95)':'rgba(242,241,238,0.9)';ctx.fill();ctx.strokeStyle='rgba(5,4,3,0.9)';ctx.lineWidth=1.5;ctx.stroke();
        const dx=p.sx-cx,dy=p.sy-cy,len=Math.hypot(dx,dy)||1,ox2=p.sx+dx/len*24,oy2=p.sy+dy/len*24,right=ox2>=cx;ctx.textAlign=right?'left':'right';const lx=ox2+(right?4:-4);
        ctx.save();ctx.shadowColor='rgba(5,4,3,0.95)';ctx.shadowBlur=8;ctx.font='10.5px "Chakra Petch",ui-monospace,Menlo,monospace';ctx.fillStyle='rgba(150,150,154,0.95)';ctx.fillText(String(i+1).padStart(2,'0'),lx,oy2-8);
        ctx.font='500 13.5px "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif';ctx.fillStyle=isR?'rgba(244,243,240,1)':'rgba(244,243,240,0.96)';ctx.fillText(ST[i],lx,oy2+7);ctx.restore()}
      biasClock+=dt; if(biasClock>BIAS_DUR){biasClock-=BIAS_DUR; biasIdx=(biasIdx+1)%6;}
      const bp=biasClock/BIAS_DUR, bt=stT(biasIdx);
      const bIn=prj(rot({x:R()*0.80*Math.cos(bt),y:R()*0.80*Math.sin(bt),z:0}));
      const stp=sp[biasIdx];
      const emph=bp<0.62?Math.min(1,bp/0.18):Math.max(0,1-(bp-0.62)/0.38);
      ctx.strokeStyle=`rgba(158,120,44,${0.5*emph})`;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(stp.sx,stp.sy,7+1.6*Math.sin(now*0.006),0,6.28);ctx.stroke();
      let bAlpha=1,jit=0,settled=0;
      if(bp<0.30){bAlpha=bp/0.30; jit=(1-bAlpha)*2.2;}
      else if(bp<0.62){bAlpha=1;}
      else {const k=(bp-0.62)/0.38; settled=k; bAlpha=1-k*0.55;}
      ctx.save();ctx.shadowColor='rgba(5,4,3,0.95)';ctx.shadowBlur=8;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='11.5px "Chakra Petch",ui-monospace,Menlo,monospace';
      const jy=bIn.sy+(jit?Math.sin(now*0.022)*jit:0);
      const wr=198-settled*48, wg=158-settled*8, wbl=84+settled*72;
      ctx.fillStyle=`rgba(${wr},${wg},${wbl},${bAlpha})`;
      ctx.fillText(BIAS[biasIdx], bIn.sx, jy);
      if(settled>0.15){
        ctx.font='8.5px "Chakra Petch",ui-monospace,Menlo,monospace';ctx.fillStyle=`rgba(150,150,156,${bAlpha*0.9})`;
        ctx.fillText('· checked ·', bIn.sx, jy+12);
      }
      ctx.restore();
      requestAnimationFrame(frame)}
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
