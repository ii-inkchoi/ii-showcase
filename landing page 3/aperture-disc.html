<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>II &middot; Aperture Disc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --c-cream: #F4F2EB;
  --c-1000: #1C1C1C;
}
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--c-cream); overflow: hidden; }
#disc { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="disc" aria-label="S&P 500 aperture disc"></canvas>
<script>
/* II aperture disc - standalone extract of the V3 hero graphic (paper register).
   String-art nested spiral aperture, solid ink core, live dial-bezel tickers. */
(function(){
  var cv=document.getElementById('disc'); var ctx=cv.getContext('2d');
  var W,H,DPR,cx,cy,scale;
  var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var INK='28,28,28', CORE_TX='244,242,235';
  var MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';
  function resize(){DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W*0.5;cy=H*0.5;scale=Math.min(W,H)*0.42;}
  resize(); addEventListener('resize',resize);
  var PITCH=1.5, yaw=0;
  function proj(px,pz){var x1=px*Math.cos(yaw)-pz*Math.sin(yaw), z1=px*Math.sin(yaw)+pz*Math.cos(yaw);
    var y2=-z1*Math.sin(PITCH), z2=z1*Math.cos(PITCH), d=3.4, s=d/(d+z2);
    return {x:cx+x1*s*scale, y:cy+y2*s*scale, s:s, depth:z2};}
  var BEZ=['AAPL','MSFT','NVDA','GOOG','AMZN','META','TSLA','V','JPM','LLY','COST','BRK','TSM','ASML','AVGO','ORCL','NFLX','AMD'];
  var BEZ_ST=[]; for(var b=0;b<BEZ.length;b++) BEZ_ST.push({ph:Math.random()*6.28, flash:0, fcol:'g'});
  var t0=performance.now();
  function frame(now){var T=now/1000, dt=Math.min(40,now-t0)/1000;t0=now;
    yaw=RM?0:0.28*Math.sin(now*0.00013);
    ctx.clearRect(0,0,W,H);
    var rot = RM?0 : now*0.00003;
    var N = RM?180:320, TW=0.62;
    var hp=proj(0,0);
    var RINGS=[{R1:0.9,R0:0.5,wI:0.4,wO:1.4},{R1:0.5,R0:0.3,wI:0.2,wO:0.7}];
    for(var ri=0;ri<RINGS.length;ri++){var rg=RINGS[ri];
      var RN=Math.max(60,Math.round(N*rg.R1));
      for(var vi=0;vi<RN;vi++){
        var a=vi/RN*6.28+rot;
        var pO=proj(Math.cos(a)*rg.R1, Math.sin(a)*rg.R1);
        var pI=proj(Math.cos(a+TW)*rg.R0, Math.sin(a+TW)*rg.R0);
        var vop=0.2+0.28*(0.5+0.5*Math.sin(a-1.1));
        var dx=pO.x-pI.x, dy=pO.y-pI.y, ln=Math.hypot(dx,dy)||1, nx=-dy/ln, ny=dx/ln;
        /* outer tip cut along the circle tangent so adjacent tips seat into a continuous rim */
        var rx=pO.x-hp.x, ry=pO.y-hp.y, rl=Math.hypot(rx,ry)||1, tx=-ry/rl, ty=rx/rl;
        ctx.fillStyle='rgba('+INK+','+vop.toFixed(3)+')';
        ctx.beginPath();
        ctx.moveTo(pI.x+nx*rg.wI, pI.y+ny*rg.wI);
        ctx.lineTo(pO.x+tx*rg.wO, pO.y+ty*rg.wO);
        ctx.lineTo(pO.x-tx*rg.wO, pO.y-ty*rg.wO);
        ctx.lineTo(pI.x-nx*rg.wI, pI.y-ny*rg.wI);
        ctx.closePath(); ctx.fill();
      }
    }
    /* solid ink core */
    ctx.fillStyle='rgba(28,28,28,0.95)'; ctx.beginPath(); ctx.arc(hp.x,hp.y,scale*0.14,0,6.28); ctx.fill();
    ctx.save();
    ctx.textAlign='center';
    ctx.font='13px '+MONO;ctx.fillStyle='rgba('+CORE_TX+',0.98)';ctx.fillText('S&P 500', hp.x, hp.y-3);
    ctx.font='10px '+MONO;ctx.fillStyle='rgba('+CORE_TX+',0.66)';ctx.fillText('BENCHMARK', hp.x, hp.y+13);
    ctx.restore();
    /* dial bezel: live tickers (fade in/out; occasional red/green flash) */
    if(!RM && Math.random()<0.06){ var fk=Math.floor(Math.random()*BEZ.length); BEZ_ST[fk].flash=1; BEZ_ST[fk].fcol=(Math.random()<0.5?'r':'g'); }
    (function(){
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      for(var ti=0;ti<BEZ.length;ti++){
        var st=BEZ_ST[ti]; st.flash=Math.max(0, st.flash-dt*0.45);
        var a=-1.5708 + ti/BEZ.length*6.2832;
        var pt0=proj(Math.cos(a)*0.92, Math.sin(a)*0.92);
        var pt1=proj(Math.cos(a)*0.96, Math.sin(a)*0.96);
        var pl=proj(Math.cos(a)*1.02, Math.sin(a)*1.02);
        var op=0.42+0.5*(0.5+0.5*Math.sin(T*0.6+st.ph*1.3));
        var f=st.flash; op=Math.min(0.98, op+f*0.5);
        var b0=28,b1=28,b2=28, tg=(st.fcol==='r')?[255,53,51]:[48,209,88];
        var cr=Math.round(b0+(tg[0]-b0)*f), cg=Math.round(b1+(tg[1]-b1)*f), cb=Math.round(b2+(tg[2]-b2)*f);
        ctx.strokeStyle='rgba('+cr+','+cg+','+cb+','+(op*0.55).toFixed(3)+')'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(pt0.x,pt0.y); ctx.lineTo(pt1.x,pt1.y); ctx.stroke();
        var ang=Math.atan2(pl.y-hp.y, pl.x-hp.x), rotA=ang+1.5708;
        if(rotA>1.5708) rotA-=3.1416; if(rotA<-1.5708) rotA+=3.1416;
        ctx.save(); ctx.translate(pl.x,pl.y); ctx.rotate(rotA);
        ctx.font='12px '+MONO; ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+op.toFixed(3)+')';
        ctx.fillText(BEZ[ti], 0, 0); ctx.restore();
      }
      ctx.restore();
    })();
    if(!RM) requestAnimationFrame(frame);
  }
  frame(performance.now());
})();
</script>
</body>
</html>
