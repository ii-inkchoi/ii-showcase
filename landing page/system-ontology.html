<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>II &middot; Capital Allocation System &middot; Ontology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --c-black: #000000; --c-900: #232627; --c-800: #565B5E; --c-700: #929292;
  --c-400: #C7C7C7; --c-200: #E3E2E2; --c-white: #FFFFFF;
  --c-live: #30D158; --c-urgent: #FF3533; --c-warning: #FF7A00;
  --mono: 'Chakra Petch', ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--c-black); font-family: 'Inter', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; width: min(100vmin, 1080px); height: min(100vmin, 1080px); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.core-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--c-700); white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="field"></canvas>
  <span class="core-label">Capital Allocation System</span>
</div>
<script>
(function () {
  var cv = document.getElementById('field');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W, H, CX, CY, R_OUT, R_IN, DPR;
  function size() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    R_OUT = W * 0.44;   // broader circle: the millions of potential things
    R_IN  = W * 0.20;   // center circle: the key elements
  }
  size();

  // dot field: dense in the annulus between the two circles, sparser in the very center,
  // a thin halo just outside the outer ring
  var N = 2600;
  var dots = [];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  for (var i = 0; i < N; i++) {
    var zone = Math.random();
    var rr;
    if (zone < 0.72)       rr = Math.sqrt(rnd(Math.pow(R_IN / R_OUT, 2), 1)) * R_OUT;          // annulus (area-uniform)
    else if (zone < 0.92)  rr = Math.sqrt(Math.random()) * R_IN * 0.94;                        // inside core, clear of label
    else                   rr = R_OUT * rnd(1.005, 1.06);                                      // faint outer halo
    var a = Math.random() * Math.PI * 2;
    dots.push({
      r: rr, a: a,
      base: rnd(0.06, 0.5),                 // resting brightness
      amp: rnd(0.15, 0.5),                  // pulse depth
      spd: rnd(0.3, 1.4),                   // pulse speed
      ph: Math.random() * Math.PI * 2,      // pulse phase
      sz: Math.random() < 0.9 ? rnd(0.6, 1.1) : rnd(1.1, 1.8),
      drift: rnd(-0.00012, 0.00012),        // very slow angular drift
      ev: 0, evT: 0, evC: null              // event flare state
    });
  }

  // occasional signal events: mostly white surges; rarely green (win / calibrated),
  // red (loss / poorly calibrated), amber (system warning / re-underwrite due)
  var EV_COLORS = ['#FFFFFF', '#FFFFFF', '#FFFFFF', '#30D158', '#FF3533', '#FF7A00'];
  function fire(t) {
    var d = dots[(Math.random() * N) | 0];
    if (d.ev > 0) return;
    d.ev = 1; d.evT = t;
    d.evC = EV_COLORS[(Math.random() * EV_COLORS.length) | 0];
  }

  function ringOutline(r, alpha) {
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(86,91,94,' + alpha + ')';   // c-800
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  var last = 0, evAcc = 0;
  function frame(t) {
    t = t / 1000;
    var dt = Math.min(t - last, 0.05); last = t;
    ctx.clearRect(0, 0, W, H);

    ringOutline(R_OUT, 0.55);
    ringOutline(R_IN, 0.4);

    // fire a few events per second, irregular
    evAcc += dt;
    if (evAcc > 0.18 + Math.random() * 0.5) { fire(t); evAcc = 0; }

    for (var i = 0; i < N; i++) {
      var d = dots[i];
      d.a += d.drift;
      var x = CX + d.r * Math.cos(d.a);
      var y = CY + d.r * Math.sin(d.a);
      var pulse = d.base + d.amp * (0.5 + 0.5 * Math.sin(d.ph + t * d.spd));
      var col = '255,255,255', alpha = pulse, size = d.sz;
      if (d.ev > 0) {
        var e = (t - d.evT) / 1.4;                       // 1.4s flare envelope
        if (e >= 1) { d.ev = 0; }
        else {
          var env = e < 0.15 ? e / 0.15 : 1 - (e - 0.15) / 0.85;
          if (d.evC !== '#FFFFFF') {
            var c = d.evC === '#30D158' ? '48,209,88' : d.evC === '#FF3533' ? '255,53,51' : '255,122,0';
            col = c; alpha = Math.max(pulse, env * 0.95); size = d.sz + env * 1.2;
          } else {
            alpha = Math.max(pulse, env); size = d.sz + env * 0.8;
          }
        }
      }
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + col + ',' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { size(); });
  frame(0);   // paint the first frame synchronously; the rAF loop takes over from there
})();
</script>
</body>
</html>
