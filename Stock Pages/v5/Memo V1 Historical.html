<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memo Historical — ATZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; }
button { background: transparent; border: none; color: inherit; font: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:#000000; --p:#FFFFFF; --s:#C7C7C7; --t:#929292; --t-800:#565B5E;
  --font:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--s); font-family: var(--font); font-weight: 400;
  letter-spacing: -0.02em; font-feature-settings: 'tnum' 1;
  width: 100%; max-width: 393px; margin: 0 auto; min-height: 100vh;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden;
}

.screen { width: 100%; display: flex; flex-direction: column; }

/* Top bar */
.topbar { display:flex; justify-content:space-between; align-items:center; padding:0 13.5px; height:71px; flex-shrink:0; border-bottom:1px solid #232627; font-size:0; }
.topbar .back { width:13px; height:13px; display:inline-flex; align-items:center; justify-content:center; color:var(--s); }
.topbar .back::before { content:''; width:8px; height:8px; border-left:1px solid currentColor; border-bottom:1px solid currentColor; transform:rotate(45deg); margin-left:2px; }
.topbar .back:active { opacity:.5; transition:opacity 80ms ease; }
.topbar .exit { font-size:14px; color:var(--s); letter-spacing:-0.02em; }
.topbar .exit:active { opacity:.5; transition:opacity 80ms ease; }

.scroll { padding: 24px 20px 40px; display:flex; flex-direction:column; gap:16px; }

.m6-ledger { font-family: var(--font); display:flex; flex-direction:column; gap:36px; }
.m6-ledger-header { padding-bottom:20px; border-bottom:1px solid #111; position:relative; }
.ticker { color:var(--s); }
.m6-ticker-hero { font-size:34px; font-weight:400; letter-spacing:-0.02em; line-height:1.18; color:var(--p); margin-bottom:12px; }
.m6-ledger-doc-label { font-size:11px; letter-spacing:-0.02em; color:var(--t); }
.m6-ledger-date-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:6px; }
.m6-ledger-date { font-size:13px; color:var(--t); letter-spacing:-0.02em; line-height:1.3; display:inline-flex; align-items:center; }
.m6-historical-badge { font-size:11px; color:var(--t-800); letter-spacing:-0.02em; }

.m6-ledger-section-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:0; }
.m6-ledger-section-head { font-size:15px; letter-spacing:-0.02em; color:var(--p); padding-bottom:10px; border-bottom:0.5px solid #1C1C1C; }
.memo-row { display:grid; grid-template-columns:80px 1fr; gap:14px; padding:14px 0; border-bottom:0.5px solid #1A1A1A; }
.memo-row:last-of-type { border-bottom:none; }
.memo-row .k { font-size:13px; font-weight:400; letter-spacing:-0.02em; color:var(--t); padding-top:2px; }
.memo-row .v { font-size:13px; font-weight:400; color:var(--s); line-height:1.65; letter-spacing:-0.02em; text-align:right; }
.memo-row .v.empty { color: var(--t-800); }
.memo-row.memo-row-prose .v { text-align:left; }
.memo-row .v p { margin-bottom:12px; }
.memo-row .v p:last-child { margin-bottom:0; }
.memo-row.memo-row-prose { display:flex; flex-direction:column; gap:8px; padding:14px 0; }
.memo-row.memo-row-prose .k { padding-top:0; }

.m6-footnotes { display:flex; flex-direction:column; gap:16px; }
.m6-immutability { font-size:11px; letter-spacing:-0.02em; color:var(--t); line-height:1.6; border-left:1px solid var(--t-800); padding-left:12px; }
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <a href="#" onclick="event.preventDefault();goBack();" class="back" aria-label="Back"></a>
      <a href="#" onclick="event.preventDefault();goBack();" class="exit" aria-label="Exit">Exit</a>
    </div>

    <div class="scroll">
      <div class="m6-ledger">

        <div class="m6-ledger-header">
          <div class="m6-ticker-hero"><span class="ticker">ATZ</span></div>
          <div class="m6-ledger-doc-label">Investment Memo</div>
          <div class="m6-ledger-date-row">
            <span class="m6-ledger-date" id="versionLabel">V1</span>
            <span class="m6-historical-badge" id="historicalBadge">Historical</span>
          </div>
        </div>

        <div>
          <div class="m6-ledger-section-row">
            <div class="m6-ledger-section-head">Memo</div>
          </div>
          <div class="memo-row" data-field="decision">
            <div class="k">Decision</div>
            <div class="v">—</div>
          </div>
          <div class="memo-row" data-field="classification">
            <div class="k">Classification</div>
            <div class="v">—</div>
          </div>
          <div class="memo-row" data-field="sizing">
            <div class="k">Sizing</div>
            <div class="v">—</div>
          </div>
          <div class="memo-row" data-field="memo">
            <div class="k">Memo</div>
            <div class="v">—</div>
          </div>
          <div class="memo-row" data-field="probability">
            <div class="k">Probability</div>
            <div class="v">—</div>
          </div>
        </div>

        <div class="m6-footnotes">
          <div class="m6-immutability" id="immutabilityNote">V1 is permanent.</div>
        </div>

      </div>
    </div>

  </div>

  <script>
    function goBack(){
      // From Historical, primary back should go to Memo History
      if (document.referrer && document.referrer.indexOf('Memo%20History') !== -1) {
        window.location.href = document.referrer; return;
      }
      if (history.length > 1) { history.back(); return; }
      window.location.href = 'Memo%20History.html';
    }

    function formatDate(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    function horizonShort(h){
      if (!h) return '';
      if (h.indexOf('1') === 0) return '1y';
      if (h.indexOf('3') === 0) return '3y';
      if (h.indexOf('5') === 0) return '5y+';
      return '';
    }
    function escapeHtml(s){
      return (s || '').replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
    }
    function render(){
      var viewing;
      try { viewing = sessionStorage.getItem('atz-memo-viewing'); } catch(e){}

      var history = [];
      try { history = JSON.parse(localStorage.getItem('atz-memo-history') || '[]'); } catch(e){}

      // Find the snapshot for the viewing version
      var snap = null;
      if (viewing) {
        for (var i = 0; i < history.length; i++) {
          if (history[i].version === viewing) { snap = history[i]; break; }
        }
      }
      // If no snapshot found, keep demo content (hardcoded V1) for direct-access scenarios
      if (!snap) return;

      // Header
      var versionLabel = document.getElementById('versionLabel');
      if (versionLabel) versionLabel.textContent = snap.version;
      var badge = document.getElementById('historicalBadge');
      if (badge) {
        var ts = snap.timestamp ? ' · Saved ' + formatDate(snap.timestamp) : '';
        badge.textContent = 'Historical' + ts;
      }

      // Find next version to mention in footer
      var currentVersion;
      try { currentVersion = localStorage.getItem('atz-memo-version'); } catch(e){}
      var immutNote = document.getElementById('immutabilityNote');
      if (immutNote) {
        var msg = snap.version + ' is permanent.';
        if (currentVersion && currentVersion !== snap.version) {
          msg += ' This version was replaced by ' + currentVersion + '.';
        }
        immutNote.textContent = msg;
      }

      // Fields
      function setField(name, value, isProse){
        var row = document.querySelector('.memo-row[data-field="' + name + '"]');
        if (!row) return;
        var v = row.querySelector('.v');
        if (!v) return;
        if (!value) {
          v.classList.add('empty');
          v.textContent = '—';
          row.classList.remove('memo-row-prose');
          return;
        }
        v.classList.remove('empty');
        if (isProse) {
          row.classList.add('memo-row-prose');
          var paras = value.split(/\n\n+/).map(function(p){
            return '<p>' + escapeHtml(p).replace(/\n/g, '<br>') + '</p>';
          }).join('');
          v.innerHTML = paras;
        } else {
          row.classList.remove('memo-row-prose');
          v.textContent = value;
        }
      }
      setField('decision', snap.decision);
      setField('classification', snap.classification);
      setField('sizing', snap.sizing);
      setField('memo', snap.memo, true);
      // Combined Probability + Horizon
      var probRow = document.querySelector('.memo-row[data-field="probability"]');
      var probV = probRow ? probRow.querySelector('.v') : null;
      if (probV) {
        if (snap.probability) {
          var hs = horizonShort(snap.horizon);
          probV.classList.remove('empty');
          probV.textContent = snap.probability + '%' + (hs ? ' · ' + hs : '');
        } else {
          probV.classList.add('empty');
          probV.textContent = '—';
        }
      }
    }
    document.addEventListener('DOMContentLoaded', render);
    window.addEventListener('pageshow', render);
  </script>
</body>
</html>
