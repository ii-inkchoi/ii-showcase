<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Placement · Compare</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/400.css">
<style>
  :root {
    --bg: #000000;
    --n-400: #C7C7C7;
    --n-700: #929292;
    --hairline: #232627;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--n-400);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 28px 24px 40px;
  }
  h1 {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 4px;
  }
  p.sub {
    font-size: 12px;
    color: var(--n-700);
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }
  .grid {
    display: flex;
    gap: 32px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .panel { display: flex; flex-direction: column; gap: 10px; }
  .panel .label {
    font-size: 12px;
    letter-spacing: -0.01em;
    color: var(--n-700);
  }
  .panel .label strong { color: #fff; font-weight: 400; }
  .frame-wrap {
    width: 393px;
    max-width: calc(100vw - 48px);
    height: 852px;
    max-height: calc(100vh - 140px);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    overflow: hidden;
    background: #000;
  }
  .frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
  .note {
    margin-top: 24px;
    font-size: 11px;
    color: var(--n-700);
    text-align: center;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <h1>Notes Placement · Compare</h1>
  <p class="sub">Same note storage — type in one, refresh the other to see it sync.</p>
  <div class="grid">
    <div class="panel">
      <p class="label"><strong>A · Notes Top</strong> — above Market Value</p>
      <div class="frame-wrap"><iframe src="stock - notes top.html" title="Notes Top"></iframe></div>
    </div>
    <div class="panel">
      <p class="label"><strong>B · Notes Above Overview</strong> — below stats, above company description</p>
      <div class="frame-wrap"><iframe src="stock - notes above overview.html" title="Notes Above Overview"></iframe></div>
    </div>
  </div>
  <p class="note">Both versions share the same saved note (stock-level, single note per stock).</p>
</body>
</html>
