<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Capital Decision — ATZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; }
button { background: transparent; border: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
:root {
  --bg:#000000; --c-1000:#1C1C1C; --elev:#0A0A0A;
  --p:#FFFFFF; --s:#C7C7C7; --t:#929292; --t-800:#565B5E;
  --font:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--s); font-family: var(--font); font-weight: 400; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; width: 100%; max-width: 393px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; animation: scr-enter 380ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
@keyframes scr-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes memo-body-reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.memo-body--reveal, .memo-foot--reveal { animation: memo-body-reveal 700ms 500ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; flex-shrink:0; }
.back-btn { color: var(--p); font-size: 22px; line-height: 1; }
.exit-btn { color: var(--p); font-size: 15px; }
.div { border: none; border-top: 0.5px solid var(--c-1000); margin: 0; }
.body-scroll { flex: 1; overflow-y: auto; }
.memo-page { padding: 32px 20px 20px; display: flex; flex-direction: column; gap: 32px; min-height: 100%; }
.mfork-title-block { padding: 4px 0 22px; }
.mfork-title { font-size: 17px; font-weight: 400; color: var(--p); line-height: 1.2; }
.context-meta { font-size: 11px; color: var(--t); margin-top: 8px; letter-spacing: -0.01em; }
.context-meta .ticker { color: var(--s); }
.field-list { display: flex; flex-direction: column; }
.radio-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; cursor: pointer; padding: 18px 0; border-bottom: 1px solid var(--c-1000); width: 100%; text-align: left; }
.radio-row:last-child { border-bottom: none; }
.radio-row.is-disabled { opacity: 0.3; pointer-events: none; }
.radio-row .lbl-block { display: flex; flex-direction: column; gap: 4px; }
.radio-row .lbl-block .head { color: var(--p); font-size: 15px; line-height: 1.32; }
.radio-row .lbl-block .sub { color: var(--t); font-size: 13px; line-height: 1.4; }
.radio-row .lbl-block .pos-meta { color: var(--t-800); font-size: 11px; line-height: 1.4; margin-top: 4px; letter-spacing: -0.005em; }
.radio-dot { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--t-800); margin-top: 2px; display: grid; place-items: center; }
.radio-row.is-on .radio-dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--p); }
.v5-foot { flex-shrink: 0; background: var(--bg); }
.v5-primary { display: flex; width: 100%; height: 64px; align-items: baseline; justify-content: flex-end; padding: 0 22px; gap: 8px; color: var(--p); font-size: 15px; background: transparent; }
.v5-primary .arrow { font-size: 18px; font-weight: 500; }
.v5-primary.locked { opacity: 0.4; pointer-events: none; }
</style>
