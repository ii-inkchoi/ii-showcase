<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memo History — ATZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; }
button { background: transparent; border: none; color: inherit; font: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
:root { --bg:#000000; --p:#FFFFFF; --s:#C7C7C7; --t:#929292; --t-800:#565B5E; --font:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--s); font-family: var(--font); font-weight: 400; letter-spacing: -0.02em; font-feature-settings: 'tnum' 1; width: 100%; max-width: 393px; margin: 0 auto; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:0 13.5px; height:71px; flex-shrink:0; border-bottom:1px solid #232627; font-size:0; }
.topbar .back { width:13px; height:13px; display:inline-flex; align-items:center; justify-content:center; color:var(--s); }
.topbar .back::before { content:''; width:8px; height:8px; border-left:1px solid currentColor; border-bottom:1px solid currentColor; transform:rotate(45deg); margin-left:2px; }
.topbar .exit { font-size:14px; color:var(--s); letter-spacing:-0.02em; }
.scroll { padding: 24px 20px 40px; }
.live-dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:#30D158; margin-right:6px; vertical-align:middle; animation:live-pulse 2.4s cubic-bezier(0.45,0,0.55,1) infinite; }
@keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.history-header { padding-bottom:20px; border-bottom:1px solid #111; margin-bottom:24px; }
.ticker-hero { font-size:34px; font-weight:400; letter-spacing:-0.02em; line-height:1.18; color:var(--p); margin-bottom:12px; }
.history-label { font-size:11px; letter-spacing:-0.02em; color:var(--t); }
.history-count { font-size:13px; color:var(--p); letter-spacing:-0.02em; margin-top:6px; line-height:1.3; }
.empty-state { font-size:13px; color:var(--t); letter-spacing:-0.02em; line-height:1.5; padding:48px 0; text-align:center; }
.empty-state .empty-action { color:var(--p); margin-top:12px; }
.year-group { display:flex; flex-direction:column; margin-top:24px; }
.year-group:first-of-type { margin-top:0; }
.year-header { display:flex; align-items:baseline; justify-content:space-between; padding:0 0 12px; border-bottom:0.5px solid #3A3D40; cursor:pointer; }
.year-label { font-size:13px; color:var(--p); letter-spacing:-0.02em; display:inline-flex; align-items:baseline; gap:8px; }
.year-caret { display:inline-block; font-size:13px; color:var(--t); transition:transform 160ms ease; transform:rotate(90deg); line-height:1; }
.year-group.collapsed .year-caret { transform:rotate(0deg); }
.year-count { font-size:11px; color:var(--t); }
.year-group.collapsed .version-row { display:none; }
.version-list { display:flex; flex-direction:column; }
.version-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:0.5px solid #1A1A1A; cursor:pointer; }
.version-row:active { opacity:0.5; }
.version-row .left { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
.vno-row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.vno-left { display:inline-flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.vno { font-size:13px; color:var(--p); letter-spacing:-0.02em; display:inline-flex; align-items:center; }
.evt-tag { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; padding:2px 6px; border:0.5px solid currentColor; }
.evt-tag.evt-buy { color:#7ec897; }
.evt-tag.evt-sell { color:#D9A441; }
.vtime { font-size:11px; color:var(--t); letter-spacing:-0.02em; }
.vdiff { font-size:12px; color:var(--t); letter-spacing:-0.02em; line-height:1.5; }
.vdiff .initial { color:var(--t); }
.version-row .chev { font-size:13px; font-weight:300; color:var(--t-800); flex-shrink:0; padding-top:4px; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="#" onclick="event.preventDefault();goBack();" class="back" aria-label="Back"></a>
    <a href="#" onclick="event.preventDefault();goBack();" class="exit" aria-label="Exit">Exit</a>
  </div>
  <div class="scroll">
    <div class="history-header">
      <div class="ticker-hero">ATZ</div>
      <div class="history-label">Memo History</div>
      <div class="history-count" id="historyCount">—</div>
    </div>
    <div id="historyBody"></div>
  </div>
  <script>
    function getLS(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
    function fmtDate(ts){ var d = new Date(ts); var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m[d.getMonth()]+' '+d.getDate(); }
    function diffSummary(curr, prev){
      if (!prev) return '<span class="initial">First version. '+(curr.classification||'—')+(curr.sizing?' · '+curr.sizing:'')+'.</span>';
      var changes=[]; var fields=[['decision','Decision'],['classification','Classification'],['sizing','Sizing'],['probability','Probability'],['horizon','Horizon'],['memo','Memo']];
      for (var i=0;i<fields.length;i++){ var k=fields[i][0], lbl=fields[i][1];
        if ((curr[k]||'')!==(prev[k]||'')){
          if (k==='memo') changes.push(lbl+' updated');
          else if (k==='probability') changes.push('Probability '+(prev[k]||'—')+'% → '+(curr[k]||'—')+'%');
          else changes.push(lbl+': '+(prev[k]||'—')+' → '+(curr[k]||'—'));
        }
      }
      return changes.length?changes.join(' · '):'No content change';
    }
    function render(){
      var hist=[]; try{ hist=JSON.parse(getLS('atz-memo-history')||'[]'); }catch(e){}
      var currentVersion=getLS('atz-memo-version');
      var countEl=document.getElementById('historyCount'); var bodyEl=document.getElementById('historyBody');
      if (!hist.length){ countEl.textContent='0 versions'; bodyEl.innerHTML='<div class="empty-state">No memo history yet.<div class="empty-action">Write your first memo to begin.</div></div>'; return; }
      countEl.textContent = hist.length===1?'1 version':hist.length+' versions';
      var groups={}; hist.forEach(function(snap,idx){ var y=new Date(snap.timestamp).getFullYear(); if(!groups[y])groups[y]=[]; groups[y].push({snap:snap, idx:idx, prev: idx>0?hist[idx-1]:null}); });
      var years=Object.keys(groups).map(Number).sort(function(a,b){return b-a;});
      var currentYear=new Date().getFullYear(); var html='';
      years.forEach(function(year){
        var rows=groups[year].slice().reverse();
        var collapsedClass = year===currentYear?'':' collapsed';
        var groupId='year-'+year;
        html+='<div class="year-group'+collapsedClass+'" id="'+groupId+'">';
        html+='<div class="year-header" onclick="toggleYear(\''+groupId+'\')">';
        html+='<span class="year-label">'+year+' <span class="year-caret">›</span></span>';
        html+='<span class="year-count">'+rows.length+(rows.length===1?' version':' versions')+'</span>';
        html+='</div>';
        html+='<div class="version-list">';
        rows.forEach(function(item){
          var snap=item.snap; var isLive=snap.version===currentVersion;
          var eventLbl='';
          if (snap.event==='buy') eventLbl='<span class="evt-tag evt-buy">Bought</span>';
          else if (snap.event==='reduce') eventLbl='<span class="evt-tag evt-sell">Sold partial</span>';
          else if (snap.event==='exit') eventLbl='<span class="evt-tag evt-sell">Exited</span>';
          html+='<a class="version-row" onclick="openVersion('+item.idx+')">';
          html+='<div class="left"><div class="vno-row"><div class="vno-left">';
          html+='<span class="vno">'+(isLive?'<span class="live-dot" aria-hidden="true"></span>':'')+snap.version+(isLive?' · Live':'')+'</span>';
          html+=eventLbl+'</div>';
          html+='<span class="vtime">'+fmtDate(snap.timestamp)+'</span></div>';
          html+='<div class="vdiff">'+diffSummary(snap, item.prev)+'</div></div>';
          html+='<span class="chev">›</span></a>';
        });
        html+='</div></div>';
      });
      bodyEl.innerHTML=html;
    }
    function toggleYear(id){ var el=document.getElementById(id); if(el) el.classList.toggle('collapsed'); }
    function openVersion(idx){
      var hist = []; try{ hist = JSON.parse(getLS('atz-memo-history')||'[]'); }catch(e){}
      var snap = hist[idx];
      var currentVersion = getLS('atz-memo-version');
      if (snap && snap.version === currentVersion){
        // Live version → editable Memo Review
        window.location.href = 'Firstime%20user_Memo%20Review.html';
      } else {
        // Past version → read-only Historical view
        try{ sessionStorage.setItem('atz-memo-history-idx', String(idx)); }catch(e){}
        window.location.href = 'Memo%20V1%20Historical.html';
      }
    }
    function goBack(){
      if (window.history.length > 1) { window.history.back(); return; }
      var src=null; try{ src=sessionStorage.getItem('atz-memo-stock-source'); }catch(e){}
      if (src){ window.location.href=src; return; }
      if (document.referrer){ window.location.href=document.referrer; return; }
      window.location.href='Stock%20Page%20Return%20User.html';
    }
    document.addEventListener('DOMContentLoaded', render);
    window.addEventListener('pageshow', render);
  </script>
</body>
</html>
